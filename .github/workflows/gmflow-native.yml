# Work branch only (never part of #1143): the hand-written burn gmflow (ci-gpu/gmflow-dev builds
# src/core/synchronization/optical_flow/gmflow/model.rs on its own) against PyTorch, on lavapipe (Vulkan, SPIR-V kernels)
# and on the paravirtual Apple GPU of the macOS runner (WGSL kernels on Metal).
name: gmflow native

on:
  push:
    branches: ['wip/gmflow-native']
    paths: ['ci-gpu/**', '!ci-gpu/baseline.trigger', '.github/workflows/gmflow-native.yml', 'src/core/synchronization/optical_flow/gmflow/**']
  workflow_dispatch:
    inputs:
      memo:
        description: why this run
        required: false

permissions:
  contents: read

concurrency:
  group: gmflow-native-${{ github.ref }}
  cancel-in-progress: true

env:
  PTH_URL: https://s3.eu-central-1.amazonaws.com/avg-projects/unimatch/pretrained/gmflow-scale2-regrefine6-mixdata-train320x576-4e7b215d.pth
  UNIMATCH_SHA: da140fa
  VIDEO_URL: https://github.com/intel-iot-devkit/sample-videos/raw/master/person-bicycle-car-detection.mp4
  CARGO_TERM_COLOR: never

jobs:
  refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python packages
        run: |
          pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: References from the unchanged PyTorch model
        run: |
          git clone -q https://github.com/AdrianEddy/unimatch.git unimatch
          git -C unimatch checkout -q "$UNIMATCH_SHA"
          curl -fsSL --retry 3 --max-time 600 -o gmflow.pth "$PTH_URL"
          curl -fsSL --retry 3 --max-time 600 -o video.mp4 "$VIDEO_URL"
          python refs_native.py gmflow.pth unimatch video.mp4 out
      - uses: actions/upload-artifact@v4
        with:
          name: gmflow-refs
          retention-days: 7
          path: ci-gpu/out

  native:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lavapipe, os: ubuntu-24.04, warm: '0', features: '', im2col: '1', best: '' }
          - { name: metal-wgsl, os: macos-14, warm: '10', features: '', im2col: '1', best: kernels+im2col+gru+gemm+linear+fused+implicit+coop }
          # The same WGSL path on the runner image of metal-msl: separates naga's translation from the macOS (Metal compiler) version
          - { name: metal-wgsl-15, os: macos-15, warm: '10', features: '', im2col: '1', best: kernels+im2col+gru+gemm+linear+fused+implicit+coop }
          - { name: metal-msl, os: macos-15, warm: '10', features: msl, im2col: '0', best: kernels+gru+fused }
    name: native-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        working-directory: ci-gpu/gmflow-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gmflow-refs
          path: ci-gpu/out
      - name: Software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools > /dev/null
          vulkaninfo --summary | sed -n '/Devices:/,$p'
      - name: macOS and Metal compiler versions
        if: runner.os == 'macOS'
        run: |
          sw_vers
          xcrun -sdk macosx metal --version || echo "no Metal toolchain in this Xcode"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - name: Build the tests
        run: time cargo test --release --features "${{ matrix.features }}" --test native --no-run
      - name: The checkpoint into the model, written as .bpk
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
        run: |
          curl -fsSL --retry 3 --max-time 600 -o "$RUNNER_TEMP/gmflow.pth" "$PTH_URL"
          GMFLOW_PTH="$RUNNER_TEMP/gmflow.pth" cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact convert_weights 2>&1 | tee convert.log
          grep -q "test result: ok. 1 passed" convert.log
          ls -la "$GMFLOW_BPK"; shasum -a 256 "$GMFLOW_BPK"
      - name: The GPU preprocessing against the CPU one
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact preprocess_matches_cpu 2>&1 | tee preprocess.log
          grep -q "test result: ok. 1 passed" preprocess.log
      - name: Each kernel against the plain operations it replaces
        run: |
          # Autotune as usual (its cache on, which matches_pytorch then reads), its choices logged
          { echo '[autotune.logger]'; echo 'level = "full"'; echo 'file = "autotune_kernels.log"'; } > cubecl.toml
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact kernels_match_plain 2>&1 | tee kernels.log || true
          rm -f cubecl.toml
          grep -q "test result: ok. 1 passed" kernels.log
      - name: burn's bilinear interpolation with each cubek strategy, batches 1 to 3 (the occasional bidirectional failure)
        run: |
          # Autotune's cache off here, so that matches_pytorch after it tunes this key on its own as before
          { echo '[autotune]'; echo 'disable_cache = true'; } > cubecl.toml
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact interpolate_strategies 2>&1 | tee interp.log || true
          rm -f cubecl.toml
          grep -q "test result: ok. 1 passed" interp.log
      - name: Against PyTorch, stage by stage and every pair
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
          GMFLOW_REF_DIR: ${{ github.workspace }}/ci-gpu/out
          GMFLOW_WARM_RUNS: ${{ matrix.warm }}
          GMFLOW_IM2COL: ${{ matrix.im2col }}
        run: |
          # Autotune as usual (its cache on), only its choices logged: the bidirectional check failed now and then (0.54 px
          # at pair 0, then every pair and the plain ops too, in the same process), as a cached bad choice would
          {
            echo '[autotune.logger]'
            echo 'level = "full"'
            echo 'file = "autotune_pytorch.log"'
          } > cubecl.toml
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact matches_pytorch 2>&1 | tee pytorch.log || true
          rm -f cubecl.toml
          grep -q "test result: ok. 1 passed" pytorch.log
      - name: matches_pytorch 4 more times, each after kernels_match_plain on an empty autotune cache (the occasional bidirectional failure; counted, not gated)
        if: matrix.best != '' && !cancelled()
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
          GMFLOW_REF_DIR: ${{ github.workspace }}/ci-gpu/out
          GMFLOW_WARM_RUNS: '0'
          GMFLOW_IM2COL: ${{ matrix.im2col }}
        run: |
          # Every failure so far came in matches_pytorch with autotune's cache on, after kernels_match_plain had tuned and
          # stored keys (bucketed shapes) that the model reuses; 22 runs with the cache off all passed. Each round here:
          # the cache emptied (cubecl keeps it in target/environment at the workspace root), kernels_match_plain, then
          # matches_pytorch with the cache on, both logged
          failed=0
          for i in 1 2 3 4; do
            rm -rf "$GITHUB_WORKSPACE/target/environment"
            { echo '[autotune.logger]'; echo 'level = "full"'; echo 'file = "autotune_seed_'"$i"'.log"'; } > cubecl.toml
            cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact kernels_match_plain > seed_$i.log 2>&1 || echo "round $i: kernels_match_plain failed"
            { echo '[autotune.logger]'; echo 'level = "full"'; echo 'file = "autotune_seeded_'"$i"'.log"'; } > cubecl.toml
            if cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact matches_pytorch > seeded_$i.log 2>&1; then
              echo "round $i: ok"
            else
              echo "round $i: FAILED"; failed=$((failed + 1))
              grep -E '^(BISTAGE|AFTER)' seeded_$i.log || true
            fi
            grep -E '^bidirectional \(kernels(\+coop)?\) pair 0' seeded_$i.log || true
          done
          rm -f cubecl.toml
          echo "failed rounds: $failed of 4"
      - name: The bidirectional pass 6 times in fresh processes, autotune cache off, its choices logged
        if: matrix.best != ''
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
          GMFLOW_REF_DIR: ${{ github.workspace }}/ci-gpu/out
          GMFLOW_IM2COL: ${{ matrix.im2col }}
        run: |
          failed=0
          for i in 1 2 3 4 5 6; do
            {
              echo '[autotune]'
              echo 'disable_cache = true'
              echo '[autotune.logger]'
              echo 'level = "full"'
              echo 'file = "autotune_'"$i"'.log"'
            } > cubecl.toml
            if cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact bidirectional_repeat > repeat_$i.log 2>&1; then
              echo "run $i: ok"
            else
              echo "run $i: FAILED"; failed=$((failed + 1))
            fi
            grep REPEAT repeat_$i.log
          done
          rm -f cubecl.toml
          echo "failed runs: $failed of 6"
          test "$failed" = 0
      - name: Matmuls at the shapes of the model against the arithmetic peak
        if: matrix.best != ''
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact matmul_ceiling 2>&1 | tee ceiling.log
          grep -q "test result: ok. 1 passed" ceiling.log
      - name: Time of each stage of the fastest configuration
        if: matrix.best != ''
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
          GMFLOW_REF_DIR: ${{ github.workspace }}/ci-gpu/out
          GMFLOW_PROFILE_OPS: ${{ matrix.best }}
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact stage_times 2>&1 | tee stages.log
          grep -q "test result: ok. 1 passed" stages.log
      - name: Per-kernel profile of the fastest configuration
        if: matrix.best != ''
        env:
          GMFLOW_BPK: ${{ runner.temp }}/gmflow.bpk
          GMFLOW_REF_DIR: ${{ github.workspace }}/ci-gpu/out
          GMFLOW_PROFILE_OPS: ${{ matrix.best }}
          CUBECL_DEBUG_LOG: stdout
          CUBECL_DEBUG_OPTION: profile-medium
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact profile_passes > profile.raw 2>&1 || { tail -n 40 profile.raw; exit 1; }
          python3 ../profile_summary.py profile.raw "PROFILE-START" "PROFILE-END" 3 | tee profile.log
      - name: The compiled source of the gemm4 and implicit GEMM kernels, checked and unchecked
        if: matrix.best != ''
        env:
          CUBECL_DEBUG_LOG: ${{ github.workspace }}/ci-gpu/gmflow-dev/sources.log
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact kernel_sources 2>&1 | tee kernel_sources.log
          grep -q "test result: ok. 1 passed" kernel_sources.log
          ls -l sources.log
      - name: What naga makes of those kernels on Metal (the WGSL of sources.log as MSL)
        if: matrix.name == 'metal-wgsl'
        run: |
          cargo test --release --features "${{ matrix.features }}" --test native -- --ignored --nocapture --exact naga_msl 2>&1 | tee naga_msl.log
          grep -q "test result: ok. 1 passed" naga_msl.log
      - name: Whether Metal compiles them as wgpu-hal does (MSL 3.1, invariance preserved)
        if: matrix.name == 'metal-wgsl'
        continue-on-error: true
        run: |
          xcrun -sdk macosx metal --version
          for f in naga_*.metal; do xcrun -sdk macosx metal -std=metal3.1 -fpreserve-invariance -c "$f" -o "${f%.metal}.air"; done
          ls -l naga_*.air
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.name }}
          retention-days: 7
          path: |
            ci-gpu/gmflow-dev/*.log
            ci-gpu/gmflow-dev/*.metal
            ci-gpu/gmflow-dev/msl_*/*.metal
            ci-gpu/gmflow-dev/Cargo.lock
