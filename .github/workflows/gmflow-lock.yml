# Work branch only (never part of #1143): Cargo.lock after a change of features in src/core/Cargo.toml, with nothing
# built: cargo metadata resolves the workspace and rewrites the lock where the resolution changed (no --locked), the
# smallest change. The lock comes back as an artifact, with its diff in the log.
name: gmflow lock

on:
  push:
    branches: ['cand/gmflow-merge-1']
    paths: ['**']
  workflow_dispatch:
    inputs:
      memo:
        description: why this run
        required: false

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo --version
      - name: Resolve the workspace and src/core (its own lock, which the core workflow builds with) and rewrite the locks
        run: |
          cargo metadata --format-version 1 > /dev/null
          (cd src/core && cargo metadata --format-version 1 > /dev/null)
          git diff --stat -- Cargo.lock src/core/Cargo.lock
          git diff -- Cargo.lock src/core/Cargo.lock | head -n 400
          git hash-object Cargo.lock src/core/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          retention-days: 7
          path: |
            Cargo.lock
            src/core/Cargo.lock
