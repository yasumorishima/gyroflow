# Work branch only (never part of #1143): runs gmflow on burn 0.22's wgpu path (Mesa lavapipe, the
# software Vulkan driver, since runners have no GPU) and on flex, and compares both with PyTorch.
# The burn 0.21 -> 0.22 move itself was settled by run 39232499330 (the steps for it were removed).
name: burn 0.22 check

on:
  push:
    branches: ['wip/burn-022', 'ccr-612a9450-yr0djw']
    paths: ['ci-burn022/**', '.github/workflows/burn022.yml', 'src/core/**', 'Cargo.toml', 'Cargo.lock']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: burn022-${{ github.ref }}
  cancel-in-progress: true

env:
  PTH_URL: https://s3.eu-central-1.amazonaws.com/avg-projects/unimatch/pretrained/gmflow-scale2-regrefine6-mixdata-train320x576-4e7b215d.pth
  UNIMATCH_SHA: da140fa
  BPK_URL: https://github.com/yasumorishima/gyroflow-models/releases/download/v1.0.0/gmflow-scale2-regrefine6-320x576-opset16-sim.bpk
  BPK_SHA256: 31feee698842928715e9ba693b69a492d85ace31c646df6f3eabd53e240cd5e9
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        working-directory: ci-burn022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python packages
        run: |
          pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==1.26.4 onnx==1.16.2 onnxsim==0.4.36 onnxruntime==1.19.2

      - name: Regenerate the ONNX and the PyTorch reference
        run: |
          git clone -q https://github.com/AdrianEddy/unimatch.git unimatch
          git -C unimatch checkout -q "$UNIMATCH_SHA"
          curl -fsSL --retry 3 -o gmflow.pth "$PTH_URL"
          python export_onnx.py gmflow.pth unimatch
          ls -la *.onnx *.f32

      - name: Published weights
        run: |
          curl -fsSL --retry 3 -o published.bpk "$BPK_URL"
          echo "$BPK_SHA256  published.bpk" | sha256sum -c -

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools > /dev/null
          vulkaninfo --summary | sed -n '/Devices:/,$p'

      - name: burn 0.22 build (flex + wgpu)
        id: newbuild
        working-directory: ci-burn022/new
        env:
          GMFLOW_ONNX: ${{ github.workspace }}/ci-burn022/gmflow-scale2-regrefine6-320x576-opset16-sim.onnx
        run: time cargo build --release

      - name: burn 0.22 flex, published .bpk
        id: newpub
        continue-on-error: true
        working-directory: ci-burn022/new
        run: ./target/release/gmflow-burn022 published ../published.bpk ../in0.f32 ../in1.f32 ../new_published.f32

      # lavapipe caps a storage buffer at 128 MiB (maxStorageBufferRange, the Vulkan minimum) and
      # gmflow's global matching needs one of 456 MiB, so on Mesa 25.2 this stops with
      # "can't allocate buffer of size: 477757440". That is accepted (and checked for); if a later
      # lavapipe can run it, its output must match PyTorch like the others.
      - name: burn 0.22 wgpu on lavapipe, published .bpk
        id: newgpu
        continue-on-error: true
        timeout-minutes: 120
        working-directory: ci-burn022/new
        env:
          GMFLOW_DEVICE: gpu
        run: |
          if ./target/release/gmflow-burn022 published ../published.bpk ../in0.f32 ../in1.f32 ../new_gpu.f32 2> err.log; then
            cat err.log
            echo "ran=1" >> "$GITHUB_OUTPUT"
          else
            tail -n 5 err.log
            grep -q "can't allocate buffer of size" err.log
            echo "::notice::lavapipe cannot hold gmflow's largest buffer; the GPU output is not compared on this runner"
          fi

      - name: Compare with PyTorch
        id: compare
        continue-on-error: true
        env:
          REQUIRED: ort_flow.f32 new_published.f32 ${{ steps.newgpu.outputs.ran == '1' && 'new_gpu.f32' || '' }}
        run: python compare.py

      # gyroflow-core itself, with the regenerated ONNX where build.rs expects it. The known-shift
      # test runs three ways: forced GPU (lavapipe: picked, then out of buffer room, so the pair
      # must be redone on flex and still be right), forced CPU, and automatic, which must not take
      # a software adapter and so has to land on flex here.
      - name: gyroflow-core builds without the GPU feature
        id: corecpu
        continue-on-error: true
        working-directory: src/core
        run: |
          mkdir -p ../../resources/gmflow
          cp ../../ci-burn022/gmflow-scale2-regrefine6-320x576-opset16-sim.onnx ../../resources/gmflow/
          cargo check --locked
          cargo check --locked --features use-burn

      - name: gyroflow-core use-burn-gpu, gmflow test on the GPU (lavapipe)
        id: coregpu
        continue-on-error: true
        timeout-minutes: 150
        working-directory: src/core
        env:
          GYROFLOW_GMFLOW_DEVICE: gpu
        run: |
          set -o pipefail
          time cargo test --locked --release --features use-burn-gpu gmflow -- --ignored --nocapture | tee gpu.log
          grep -E 'gmflow device: (flex \(CPU\) after )?wgpu: llvmpipe' gpu.log

      - name: gyroflow-core use-burn-gpu, gmflow test forced to the CPU, then automatic
        id: corefallback
        continue-on-error: true
        timeout-minutes: 60
        working-directory: src/core
        run: |
          set -o pipefail
          GYROFLOW_GMFLOW_DEVICE=cpu cargo test --locked --release --features use-burn-gpu gmflow -- --ignored --nocapture
          cargo test --locked --release --features use-burn-gpu gmflow -- --ignored --nocapture | tee auto.log
          grep -qx 'gmflow device: flex (CPU)' auto.log

      - name: Result
        if: always()
        run: |
          echo "newpub=${{ steps.newpub.outcome }} newgpu=${{ steps.newgpu.outcome }} compare=${{ steps.compare.outcome }} corecpu=${{ steps.corecpu.outcome }} coregpu=${{ steps.coregpu.outcome }} corefallback=${{ steps.corefallback.outcome }}"
          test "${{ steps.compare.outcome }}" = success
          test "${{ steps.corecpu.outcome }}" = success
          test "${{ steps.coregpu.outcome }}" = success
          test "${{ steps.corefallback.outcome }}" = success
